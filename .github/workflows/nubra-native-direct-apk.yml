name: NUBRA Native APK Direct Download
on:
  push:
    branches: [nubra-native-apk-preview]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android 36 SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
      - name: Assemble installable NUBRA APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nubra-native-android-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Direct download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p releases
          cp app/build/outputs/apk/debug/app-debug.apk releases/NUBRA-preview.apk
          if gh release view nubra-preview-native >/dev/null 2>&1; then
            gh release upload nubra-preview-native releases/NUBRA-preview.apk --clobber
          else
            gh release create nubra-preview-native releases/NUBRA-preview.apk --target "$GITHUB_SHA" --title "NUBRA Preview APK" --notes "Installable Arabic Android offline preview. No production accounts, server upload, or live TV streaming." --prerelease
          fi
